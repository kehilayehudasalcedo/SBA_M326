<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Bootstrap  diseño a celulares (375px) y escritorio (1440px) -->
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Fraunces:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./style2.css"> <!-- CSS despues de Bootstrap-->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <title>Frontend Mentor | Hotel booking confirmation page</title>
</head>

<body>
  <div class="container-fluid p-0">
    <div class="row g-0 min-vh-100">
      <aside class="col-12 col-lg-3 sidebar-bg p-4 d-flex flex-column justify-content-between border-end"> <!-- brazos col-12 ocupa las 12 columnas col-lg-3 en pantallas grandes se encoge y ocupa solo 2 de las 12 sidebar-bg clase en mi css pinta el fondo en color crema hsl 40 60 y 98 de style-guide p-4 es padding para que el texto quede pegado a los bordes d-flex activa flexbox flex-column apila todo en forma de columna vertical -->
        <div>
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="font-serif fs-4 m-0">
              <em class="text-terracotta">Maison</em> 
              <strong class="d-block">Soleil</strong>
            </h1>
            <button class="btn border d-lg-none" type="button" data-bs-toggle="collapse" data-bs-target="#guest_nav" aria-expanded="false" aria-label="Toggle navigation">
              &#9776; <!-- Codigo para la Hamburguesita-->
            </button> <!-- Hamburguesita-->
          </div> <!-- Esquina Maison Soleil -->
          
          <nav class="collapse d-lg-block" id="guest_nav"> 
            <ul class="nav flex-column gap-2">
              <li class="nav-item">
                <a class="nav-link active-nav d-flex justify-content-between align-items-center rounded-3 px-3 py-2" href="#">
                  <span>Your stay</span>
                  <span class="badge rounded-pill badge-terracotta">1</span> <!-- requerido. numero rojito chiquito  -->
                </a>
              </li>
              <li class="nav-item"><a class="nav-link text-dark px-3 py-2" href="#">The house</a></li>
              <li class="nav-item"><a class="nav-link text-dark px-3 py-2" href="#">Around town</a></li>
              <li class="nav-item"><a class="nav-link text-dark px-3 py-2" href="#">Breakfast</a></li>
              <li class="nav-item"><a class="nav-link text-dark px-3 py-2" href="#">Messages</a></li>
            </ul>
          </nav>
        </div>
        
        <div class="mt-4"> <!--margin top mt-4 -->
          <div class="weather-card p-3 rounded-4 mb-3">
            <small class="text-uppercase font-mono d-block">Today in Cassis</small> <!-- remover no afecta d-block-->
            <div class="display-6 font-serif my-1">27°</div> <!--remover no afecta my-1-->
            <small>Sunny · light breeze</small>
          </div>
          <div class="font-mono small text-muted">
            <p class="mb-1">Est. 1987</p>
            <p class="mb-1">Maison Soleil · 12 RUE DES OLIVIERS · CASSIS</p>
            <p class="mb-0">© 2026 Maison Soleil</p>
          </div>
        </div>
      </aside>

      <main class="col-12 col-lg-9 main-bg p-4 p-lg-5"> 
        <header class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-5"> <!-- confirmado main-bg es mi clase en css -->
          <div>
            <p class="font-mono text-uppercase small text-muted mb-1">Booking · Confirmed</p>
            <h2 class="font-serif display-5 m-0">Bienvenue, <em class="text-terracotta">Lucia.</em></h2>
          </div>
          <div class="d-flex gap-2">
            <button type="button" class="btn btn-light border rounded-pill px-4 py-2">Print receipt</button>
            <button type="button" class="btn btn-dark rounded-pill px-4 py-2">Add to calendar</button>
          </div>
        </header>

    

        
        

</body>
</html>
